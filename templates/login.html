<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; }
        .auth-card { max-width: 420px; margin: 0 auto; }
        .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px; }
        .card-header { background: transparent; border-bottom: 1px solid #2a2a4a; }
        .form-control { background: #12121e; border: 1px solid #2a2a4a; color: #e0e0e0; }
        .form-control:focus { background: #12121e; border-color: #6c5ce7; color: #e0e0e0; box-shadow: 0 0 0 2px rgba(108,92,231,.3); }
        .btn-primary { background: #6c5ce7; border: none; }
        .btn-primary:hover { background: #5a4bd1; }
        .logo { font-size: 2rem; color: #6c5ce7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="card">
                <div class="card-header text-center py-4">
                    <div class="logo mb-2"><i class="bi bi-wallet2"></i></div>
                    <h4 class="mb-0">Finance Tracker</h4>
                    <small class="text-muted">Sign in to your account</small>
                </div>
                <div class="card-body p-4">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'warning' if category == 'warning' else 'info' }} alert-dismissible fade show py-2 small">
                                    {{ message }}
                                    <button type="button" class="btn-close btn-close-white btn-sm" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label small">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Sign In</button>
                    </form>
                    <p class="text-center mt-3 mb-0 small text-muted">
                        Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none" style="color:#6c5ce7;">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
