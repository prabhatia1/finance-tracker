{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-plus-circle text-green"></i> New Transaction
            </div>
            <div class="card-body p-3 p-md-4">
                <form method="POST" action="/add" onsubmit="document.querySelector('.btn-submit').disabled=true; this.querySelector('.btn-submit').innerHTML='⏳ Adding...'">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-6 col-md-4">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" name="date" value="{{ today }}" required>
                        </div>
                        <div class="col-6 col-md-4">
                            <label class="form-label">Type</label>
                            <select class="form-select" name="txn_type">
                                <option value="debit">💸 Expense</option>
                                <option value="credit">💰 Income</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label">Amount (₹)</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" min="0" max="50000000" class="form-control" name="amount" placeholder="500" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" name="description" placeholder="e.g. Swiggy, LIC premium, Amazon..." autofocus>
                        </div>
                        <div class="col-6 col-md-6">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="category">
                                <option value="Auto">🤖 Auto-detect</option>
                                {% for cat in categories %}
                                <option value="{{ cat.name }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6 col-md-6">
                            <label class="form-label">Bank / Card <span class="text-red">*</span></label>
                            <div class="input-group">
                                <select class="form-select" name="card_id" required>
                                    <option value="" disabled selected>— Select —</option>
                                    {% for card in cards %}
                                    <option value="{{ card.id }}">{{ card.name }}</option>
                                    {% endfor %}
                                </select>
                                <button type="button" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addCardModal">
                                    <i class="bi bi-plus"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-6 col-md-6">
                            <label class="form-label">Person <small class="text-secondary-custom">(optional)</small></label>
                            <div class="input-group">
                                <select class="form-select" name="person">
                                    <option value="">— None —</option>
                                    {% for p in persons %}
                                    <option value="{{ p }}">{{ p }}</option>
                                    {% endfor %}
                                </select>
                                <button type="button" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addPersonModal">
                                    <i class="bi bi-plus"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-6 col-md-6">
                            <label class="form-label text-green">💰 Cashback (manual)</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" min="0" name="cashback" class="form-control" placeholder="0" value="0">
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes <small class="text-secondary-custom">(optional)</small></label>
                            <input type="text" class="form-control" name="notes" placeholder="Any extra details...">
                        </div>
                        <div class="col-12 d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-success btn-submit px-4"><i class="bi bi-check-lg"></i> Add</button>
                            <a href="/" class="btn btn-outline-light">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-body py-2 text-secondary-custom" style="font-size:0.82rem">
                <i class="bi bi-lightbulb text-orange"></i>
                Choose <strong>"Auto-detect"</strong> — it matches keywords in the description (e.g. "LIC" — LIC Premium, "Swiggy" — Food).
            </div>
        </div>
    </div>
</div>

<!-- Add Person Modal -->
<div class="modal fade" id="addPersonModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"><i class="bi bi-person-plus text-info"></i> Add Person</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form method="POST" action="/settings" onsubmit="return document.getElementById('newPersonName').value.trim() !== ''">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="action" value="add_person">
                <input type="hidden" name="next" value="{{ request.url }}">
                <div class="modal-body">
                    <input type="text" id="newPersonName" class="form-control" name="person_name"
                           placeholder="Person name" required autofocus>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-check-lg"></i> Add Person</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Add Bank/Card Modal -->
<div class="modal fade" id="addCardModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"><i class="bi bi-credit-card text-blue"></i> Add Bank / Card</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form method="POST" action="/settings" onsubmit="return document.getElementById('newCardName').value.trim() !== ''">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="action" value="add_card">
                <input type="hidden" name="next" value="{{ request.url }}">
                <div class="modal-body">
                    <input type="text" id="newCardName" class="form-control mb-2" name="card_name"
                           placeholder="Bank / Card name (e.g. SBI Cashback)" required>
                    <input type="text" class="form-control" name="card_type"
                           placeholder="Type (e.g. Visa, Mastercard, RuPay)">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-check-lg"></i> Add Card</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
