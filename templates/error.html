<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if code == 404 %}Page Not Found{% else %}Something Went Wrong{% endif %} — Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .error-card { text-align: center; max-width: 420px; }
        .error-code { font-size: 4rem; font-weight: 700; color: #30363d; line-height: 1; }
        .error-message { font-size: 1.1rem; color: #8b949e; margin: 0.75rem 0 1.5rem; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">{{ code }}</div>
        <div class="error-message">{{ message }}</div>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">← Back to Dashboard</a>
    </div>
</body>
</html>
