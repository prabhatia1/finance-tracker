{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:450px;">
  <h3 class="mb-4">🔑 Forgot Password</h3>
  <p class="text-muted">Enter your username and your security word to set a new password.</p>

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" value="{{ username or '' }}" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Security Word</label>
      <input type="text" name="security_word" class="form-control" required>
      <div class="form-text">The word you set in your Settings page.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" name="new_password" class="form-control" minlength="4" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input type="password" name="confirm" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Reset Password</button>
  </form>

  <div class="mt-3 text-center">
    <a href="{{ url_for('login') }}" class="text-decoration-none">← Back to Login</a>
  </div>
</div>
{% endblock %}
