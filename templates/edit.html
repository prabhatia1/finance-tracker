{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-pencil-square text-orange"></i> Edit Transaction
            </div>
            <div class="card-body">
                <form method="POST" action="/edit/{{ txn.id }}" onsubmit="document.querySelector('.btn-warning').disabled=true; this.querySelector('.btn-warning').innerHTML='⏳ Saving...'">
                    <div class="row g-3">
                        <!-- Date -->
                        <div class="col-md-4">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" name="date" value="{{ txn.date }}" required>
                        </div>

                        <!-- Type -->
                        <div class="col-md-4">
                            <label class="form-label">Type</label>
                            <select class="form-select" name="txn_type">
                                <option value="debit" {% if txn.txn_type == 'debit' %}selected{% endif %}>💸 Debit / Expense</option>
                                <option value="credit" {% if txn.txn_type == 'credit' %}selected{% endif %}>💰 Credit / Income</option>
                            </select>
                        </div>

                        <!-- Amount -->
                        <div class="col-md-4">
                            <label class="form-label">Amount (₹)</label>
                            <div class="amount-input-group">
                                <span class="currency-symbol">₹</span>
                                <input type="number" step="0.01" min="0" class="form-control" name="amount"
                                       value="{{ "%.2f"|format(txn.amount) }}" required>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" name="description"
                                   value="{{ txn.description }}" required autofocus>
                        </div>

                        <!-- Category + Card row -->
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="category">
                                <option value="Auto">🤖 Auto-detect</option>
                                {% for cat in categories %}
                                <option value="{{ cat.name }}" {% if txn.category == cat.name %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Card <span class="text-danger">*</span></label>
                            <select class="form-select" name="card_id" required>
                                <option value="" disabled>— Select Card —</option>
                                {% for card in cards %}
                                <option value="{{ card.id }}" {% if txn.card_id == card.id %}selected{% endif %}>{{ card.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Notes -->
                        <div class="col-12">
                            <label class="form-label">Notes <small class="text-muted">(optional)</small></label>
                            <input type="text" class="form-control" name="notes"
                                   value="{{ txn.notes or '' }}"
                                   placeholder="Any extra details...">
                        </div>

                        <!-- Person -->
                        <div class="col-md-6">
                            <label class="form-label">Person <small class="text-muted">(friend/family)</small></label>
                            <select class="form-select" name="person">
                                <option value="">— None —</option>
                                {% for p in persons %}
                                <option value="{{ p }}" {% if txn.person == p %}selected{% endif %}>{{ p }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Cashback (manual) -->
                        <div class="col-md-6">
                            <label class="form-label text-success">💰 Est. Cashback</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark text-success border-success">₹</span>
                                <input type="number" step="0.01" min="0" name="cashback"
                                       class="form-control bg-dark text-success border-success"
                                       placeholder="0.00" value="{{ txn.cashback or 0 }}">
                            </div>
                            <small class="text-muted">Enter estimated cashback you expect to earn</small>
                        </div>

                        <!-- Submit -->
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-warning px-4">
                                <i class="bi bi-check-lg"></i> Update Transaction
                            </button>
                            <a href="/" class="btn btn-outline-light">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
